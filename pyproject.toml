[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-loop-harness"
version = "0.1.0"
description = "Local-first repository agent harness for governed AI coding loops."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Joseph Ke Han" }]
keywords = [
    "ai-agents",
    "agent-harness",
    "coding-agents",
    "langgraph",
    "mcp",
    "repository-analysis",
    "repository-automation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["textual>=8.2,<9"]

[project.urls]
Homepage = "https://github.com/josephkehan-prog/repo-loop-harness"
Documentation = "https://github.com/josephkehan-prog/repo-loop-harness#readme"
Issues = "https://github.com/josephkehan-prog/repo-loop-harness/issues"
Source = "https://github.com/josephkehan-prog/repo-loop-harness"

[project.optional-dependencies]
dev = ["coverage>=7.6,<8", "ruff>=0.11,<1"]

[project.scripts]
repo-loop = "repo_loop.cli:entrypoint"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.package-data]
repo_loop = ["web/*.html", "web/*.css", "web/*.js"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true
source = ["repo_loop"]

[tool.coverage.report]
fail_under = 80
show_missing = true
