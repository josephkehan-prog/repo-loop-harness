name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: uv sync --extra dev --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test with branch coverage
        run: |
          uv run coverage run -m unittest discover -s tests
          uv run coverage report -m

      - name: Run reproducible proof
        run: |
          uv run repo-loop proof . --json > /tmp/repo-loop-proof.json
          uv run python -c 'import json; report=json.load(open("/tmp/repo-loop-proof.json")); assert report["result"] == "pass"'

      - name: Build package
        run: uv build

      - name: Audit dependencies
        run: uv export --locked --no-dev --no-emit-project --no-hashes | uvx pip-audit -r /dev/stdin
